# Only for local development WITH Docker: just a Postgres database.
#   docker compose -f docker-compose.dev.yml up -d
# Then use  DATABASE_URL="postgresql://astro:astro@localhost:5432/astrotalk"  in .env
# (No Docker? "npm run db:up" starts a local Postgres without it.)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astrotalk
    ports:
      - "5432:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data
volumes:
  devpgdata:
